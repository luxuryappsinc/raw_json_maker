<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Number Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: #f5f5f5;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 20px;
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 8px;
    }

    button:hover {
      background: #0056b3;
    }
    .frame-container {
      position: relative;
      overflow: hidden;
      border: 1px solid #ccc;
    }

    .iframe-wrapper {
      width: 100%;
      height: 100%;
      transform-origin: top left;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .controls {
      position: absolute;
      top: 5px;
      right: 5px;
      background: rgba(0,0,0,0.6);
      padding: 5px;
      border-radius: 5px;
    }

    .controls button {
      color: white;
      background: transparent;
      border: 1px solid white;
      margin: 2px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1 id="display">000-00-00</h1>
  <button onclick="generate(1)">+1</button>
<button onclick="generate(10)">+10</button>
<button onclick="generate(100)">+100</button>
  <iframe id="myFrame0"></iframe>

  <iframe id="myFrame0" width="600" height="400"></iframe>

<script>
let counter = 0;

function formatNumber(num) {
  let str = num.toString().padStart(7, '0');
  return `${str.substring(0,3)}-${str.substring(3,5)}-${str.substring(5,7)}`;
}

function generate(step) {
  if (counter > 9999999) {
    alert("Reached the maximum: 999-99-99");
    return;
  }

  let formatted = formatNumber(counter);

  document.getElementById("myFrame0").src =
    "https://degree-verification.southern.ac.bd/verify?id=" + formatted;

  document.getElementById("display").innerText = formatted;

  counter += step;
}
</script>
</body>
</html>
